version: 2
jobs:
  puppetlabs_spec_ruby34:
    docker:
      - image: cimg/ruby:3.4
    steps:
      - checkout
      - run: bundle install
      - run: bundle exec rake

  puppetlabs_spec_ruby40:
    docker:
      - image: cimg/ruby:4.0
    steps:
      - checkout
      - run: bundle install
      - run: bundle exec rake

